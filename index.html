<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <title>Frontend Mentor | QR code component</title>

</head>

<body class="flex justify-center items-center
            bg-[hsl(212,45%,89%)]
            h-screen
            font-Outfit
            ">

  <div class=" flex justify-center items-center">
    <div class="flex flex-col items-center justify-between
      w-90 h-140 md:w-80 md:h-125
      bg-white p-5 pb-0
        rounded-2xl">
      <section class="flex justify-center md:h-70">
        <img class="w-full h-full rounded-2xl" src="./images/image-qr-code.png" alt="">
      </section>
      <section class="flex flex-col text-center justify-center items-center h-full">
        <h2 class="text-2xl md:text-2xl w-75 font-semibold">Improve your front-end skills by building projects</h2>
        <p class="text-lg md:text-md text-gray-500 mt-2">Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level</p>
      </section>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
